<div class="reclamation-client-page">
  <header class="page-header">
    <button type="button" class="back-link" (click)="goBack()">
      <span class="material-icons">arrow_back</span>
      Retour aux commandes
    </button>
    <h1 class="page-title">Nouvelle réclamation</h1>
    <p class="page-subtitle">Décrivez votre problème concernant cette ligne de commande.</p>
  </header>

  @if (errorMessage()) {
    <div class="alert alert-error">
      <span class="material-icons">error</span>
      {{ errorMessage() }}
    </div>
  }

  @if (successMessage()) {
    <div class="alert alert-success">
      <span class="material-icons">check_circle</span>
      {{ successMessage() }}
    </div>
  }

  @if (clientId() && produitId()) {
    <div class="form-card">
      <form (submit)="save(); $event.preventDefault()">
        <div class="form-group">
          <label for="notes">Notes <span class="required">*</span></label>
          <textarea
            id="notes"
            name="notes"
            rows="8"
            placeholder="Décrivez le problème rencontré..."
            [ngModel]="notes()"
            (ngModelChange)="notes.set($event)"
            required
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-outline" (click)="goBack()">Annuler</button>
          <button type="submit" class="btn-primary" [disabled]="isSaving()">
            @if (isSaving()) {
              Envoi en cours...
            } @else {
              Envoyer la réclamation
            }
          </button>
        </div>
      </form>
    </div>
  }
</div>
