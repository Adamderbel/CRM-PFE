<div class="admin-dashboard">
  <!-- En-tête -->
  <div class="dashboard-header">
    <div class="header-left">
      <h1 class="page-title">Tableau de Bord CRM</h1>
    </div>
    <div class="header-right">
      <span class="material-icons header-icon">calendar_today</span>
      <span class="header-date">{{ currentDate() }}</span>
    </div>
  </div>

  <!-- Utilisateurs par Rôle -->
  <section class="charts-section-full">
    <div class="chart-card">
      <div class="chart-header">
        <h2 class="chart-title">Utilisateurs par Rôle</h2>
        <div class="chart-legend">
          <span class="material-icons legend-icon">people</span>
          <span class="legend-text">Répartition globale</span>
        </div>
      </div>
      <div class="chart-body">
        <canvas #usersByRoleChart></canvas>
      </div>
    </div>
  </section>
</div>
